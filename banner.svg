<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Devanshu Verma — Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:800 54px 'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}
    .role{font:600 22px 'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#cbd5e1}
    .tag{font:500 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94a3b8}
    .code{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .chip{font:600 14px 'Segoe UI',Inter,system-ui,sans-serif;fill:#e2e8f0}
    .float1{animation:f 7s ease-in-out infinite}
    .float2{animation:f 9s ease-in-out infinite reverse}
    .caret{animation:b 1.1s steps(1) infinite}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes b{50%{opacity:0}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float1" cx="1020" cy="40" r="220" fill="url(#glow1)"/>
    <circle class="float2" cx="760" cy="300" r="200" fill="url(#glow2)"/>
    <rect x="0" y="292" width="1200" height="8" fill="url(#accent)"/>

    <!-- Left: name + role -->
    <g transform="translate(64,0)">
      <text class="tag" x="0" y="88">&lt;hello world /&gt;</text>
      <text class="name" x="0" y="152">Devanshu Verma</text>
      <rect x="2" y="170" width="120" height="4" rx="2" fill="url(#accent)"/>
      <text class="role" x="0" y="212">Frontend Developer · React · Next.js · TypeScript</text>
      <g transform="translate(0,236)">
        <rect width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="chip" x="66" y="20" text-anchor="middle">5+ yrs exp</text>
        <rect x="144" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="chip" x="219" y="20" text-anchor="middle">10+ apps shipped</text>
        <rect x="306" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="chip" x="381" y="20" text-anchor="middle">Noida, India 🇮🇳</text>
      </g>
    </g>

    <!-- Right: code window -->
    <g transform="translate(770,58)"><g class="float1">
      <rect width="370" height="186" rx="12" fill="#0b1224" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="5.5" fill="#f87171"/>
      <circle cx="38" cy="20" r="5.5" fill="#fbbf24"/>
      <circle cx="56" cy="20" r="5.5" fill="#34d399"/>
      <text class="code" x="300" y="25" fill="#64748b" font-size="12">dev.tsx</text>
      <line x1="0" y1="38" x2="370" y2="38" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="code" x="20" y="66"><tspan fill="#c084fc">const</tspan> <tspan fill="#7dd3fc">devanshu</tspan> <tspan fill="#e2e8f0">= {</tspan></text>
      <text class="code" x="40" y="90"><tspan fill="#93c5fd">role</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Frontend Dev"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text class="code" x="40" y="114"><tspan fill="#93c5fd">stack</tspan><tspan fill="#e2e8f0">: [</tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Next"</tspan><tspan fill="#e2e8f0">],</tspan></text>
      <text class="code" x="40" y="138"><tspan fill="#93c5fd">motto</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"apps that feel instant"</tspan></text>
      <text class="code" x="20" y="162"><tspan fill="#e2e8f0">};</tspan><tspan class="caret" fill="#38bdf8"> ▍</tspan></text>
    </g></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Devanshu Verma — Frontend Engineer</title>
<desc id="desc">Animated banner: Hey, I'm Devanshu. Frontend engineer building fast, accessible web apps with React, Next.js and TypeScript. A browser window loads a UI and scores 100 on performance.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#db2777"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#db2777"/></linearGradient>
  <linearGradient id="shimmer" x1="0" x2="1">
    <stop offset="0" stop-color="#e2e8f0"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="1.4s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="lineU" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#db2777"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0f172a" fill-opacity="0.05"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter>
  <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
</defs>
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .b1{animation:drift1 14s ease-in-out infinite} .b2{animation:drift2 18s ease-in-out infinite} .b3{animation:drift1 22s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,40px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
  .wave{transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.4s ease-in-out infinite}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
  .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
  .d1{animation-delay:.1s} .d2{animation-delay:.35s} .d3{animation-delay:.6s} .d4{animation-delay:.85s} .d5{animation-delay:1.1s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}
  .f2{animation-duration:7.5s;animation-delay:-2s} .f3{animation-duration:9s;animation-delay:-4s} .f4{animation-duration:6.8s;animation-delay:-1s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
  .caret{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .skel{animation:skel 8s ease-in-out infinite} @keyframes skel{0%,30%{opacity:1}36%,92%{opacity:0}100%{opacity:1}}
  .ui{animation:ui 8s ease-in-out infinite} @keyframes ui{0%,32%{opacity:0}38%,90%{opacity:1}96%,100%{opacity:0}}
  .ring{stroke-dasharray:201;stroke-dashoffset:201;animation:ring 8s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes ring{0%,38%{stroke-dashoffset:201}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:201}}
  .score{animation:score 8s ease-in-out infinite} @keyframes score{0%,55%{opacity:0}60%,90%{opacity:1}96%,100%{opacity:0}}
  .cursor{animation:cursor 8s ease-in-out infinite}
  @keyframes cursor{0%,40%{transform:translate(130px,90px);opacity:0}45%{opacity:1}62%{transform:translate(0,0)}66%{transform:translate(0,0) scale(.85)}70%,88%{transform:translate(0,0);opacity:1}94%,100%{opacity:0;transform:translate(0,0)}}
  .btn{transform-box:fill-box;transform-origin:center;animation:press 8s ease-in-out infinite}
  @keyframes press{0%,63%{transform:scale(1)}66%{transform:scale(.93)}70%,100%{transform:scale(1)}}
  .toast{animation:toast 8s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes toast{0%,67%{opacity:0;transform:translateY(16px)}72%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
  .flow{stroke-dasharray:60 1140;animation:flow 6s linear infinite} @keyframes flow{to{stroke-dashoffset:-1200}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.ui,.score{opacity:1}.skel,.cursor,.toast{opacity:0}.ring{stroke-dashoffset:0}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.55">
    <circle class="b1" cx="180" cy="80" r="160" fill="#c4b5fd"/>
    <circle class="b2" cx="1000" cy="330" r="170" fill="#67e8f9"/>
    <circle class="b3" cx="620" cy="380" r="120" fill="#f9a8d4"/>
  </g>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- floating glyphs -->
  <g class="mono" font-weight="700" fill="#475569" opacity=".35">
    <text class="float" x="600" y="70" font-size="26">{ }</text>
    <text class="float f2" x="640" y="330" font-size="22">&lt;/&gt;</text>
    <text class="float f3" x="40" y="370" font-size="20">()=&gt;</text>
    <text class="float f4" x="1140" y="60" font-size="22">#</text>
  </g>

  <!-- left copy -->
  <g class="sans">
    <g class="rise d1">
      <rect x="64" y="70" width="156" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="84" cy="86" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="98" y="91" class="mono" font-size="13" fill="#475569">open to work</text>
    </g>
    <g class="rise d2">
      <text x="64" y="160" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">Hey, I'm <tspan fill="url(#txt)">Devanshu</tspan></text>
      <text class="wave" x="538" y="158" font-size="46">👋</text>
    </g>
    <text class="rise d3" x="64" y="205" font-size="22" font-weight="600" fill="#0f172a">Frontend Engineer who builds web apps that <tspan fill="url(#txt)">feel instant</tspan>.</text>
    <text class="rise d3 mono" x="64" y="240" font-size="15" fill="#475569">React · Next.js · TypeScript · Angular · Vue<tspan class="caret" fill="#0891b2"> ▍</tspan></text>
    <g class="rise d4" font-size="14" font-weight="600" fill="#0f172a">
      <rect x="64" y="272" width="112" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/><text x="120" y="294" text-anchor="middle">⚡ 5+ years</text>
      <rect x="186" y="272" width="148" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/><text x="260" y="294" text-anchor="middle">🚀 10+ apps shipped</text>
      <rect x="344" y="272" width="132" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/><text x="410" y="294" text-anchor="middle">📍 Noida, India</text>
    </g>
  </g>

  <!-- browser window -->
  <g class="rise d5" filter="url(#shadow)">
    <rect x="700" y="56" width="440" height="288" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M700 72a16 16 0 0 1 16-16h408a16 16 0 0 1 16 16v20H700z" fill="#f1f5f9"/>
    <circle cx="722" cy="74" r="5.5" fill="#ff5f57"/><circle cx="740" cy="74" r="5.5" fill="#febc2e"/><circle cx="758" cy="74" r="5.5" fill="#28c840"/>
    <rect x="800" y="64" width="240" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="920" y="78" text-anchor="middle" class="mono" font-size="11" fill="#475569">🔒 devanshuverma.in</text>

    <!-- skeleton state -->
    <g class="skel">
      <rect x="724" y="112" width="180" height="16" rx="8" fill="url(#shimmer)"/>
      <rect x="724" y="138" width="250" height="10" rx="5" fill="url(#shimmer)"/>
      <rect x="724" y="156" width="220" height="10" rx="5" fill="url(#shimmer)"/>
      <rect x="724" y="186" width="190" height="130" rx="12" fill="url(#shimmer)"/>
      <rect x="926" y="186" width="190" height="130" rx="12" fill="url(#shimmer)"/>
    </g>

    <!-- loaded UI -->
    <g class="ui sans">
      <text x="724" y="126" font-size="17" font-weight="800" fill="#0f172a">Ship it. Fast. ✨</text>
      <text x="724" y="150" font-size="12" fill="#475569">Accessible. Responsive. Delightful.</text>
      <rect x="724" y="186" width="190" height="130" rx="12" fill="#f1f5f9"/>
      <text x="740" y="210" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">LIGHTHOUSE</text>
      <circle cx="790" cy="262" r="32" fill="none" stroke="#e2e8f0" stroke-width="7"/>
      <circle class="ring" cx="790" cy="262" r="32" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" transform="rotate(-90 790 262)"/>
      <text class="score" x="790" y="269" text-anchor="middle" font-size="20" font-weight="800" fill="#22c55e">100</text>
      <text x="836" y="252" font-size="11" fill="#475569">Perf</text>
      <text x="836" y="268" font-size="11" fill="#475569">A11y</text>
      <text x="836" y="284" font-size="11" fill="#475569">SEO</text>
      <text x="870" y="252" font-size="11" font-weight="700" fill="#22c55e">100</text>
      <text x="870" y="268" font-size="11" font-weight="700" fill="#22c55e">100</text>
      <text x="870" y="284" font-size="11" font-weight="700" fill="#22c55e">100</text>

      <rect x="926" y="186" width="190" height="130" rx="12" fill="#f1f5f9"/>
      <rect x="942" y="202" width="70" height="8" rx="4" fill="#7c3aed" opacity=".7"/>
      <rect x="942" y="218" width="150" height="8" rx="4" fill="#475569" opacity=".35"/>
      <rect x="942" y="232" width="120" height="8" rx="4" fill="#475569" opacity=".35"/>
      <g class="btn">
        <rect x="942" y="262" width="158" height="36" rx="10" fill="url(#line)"/>
        <text x="1021" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Deploy to prod →</text>
      </g>
    </g>

    <!-- cursor -->
    <g class="cursor"><path d="M1060 278l0 22 6-6 5 11 4-2-5-11 8 0z" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/></g>
    <!-- toast -->
    <g class="toast sans">
      <rect x="944" y="128" width="176" height="36" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-opacity=".5"/>
      <text x="1032" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">✓ Shipped in 0.8s</text>
    </g>
  </g>

  <!-- bottom flowing line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#line)" opacity=".35"/>
  <path class="flow" d="M0 398H1200" stroke="url(#lineU)" stroke-width="4"/>
</g>
</svg>
